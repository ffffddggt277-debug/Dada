<style>

--acid:#8cff9e;--paper:#e9f2ea;--dim:#7fa08f;--warn:#ffb020;--os:#c3c7cb;--osd:#7a7c82;--osteal:#0e7f7b;
--px:'Press Start 2P',monospace;--dp:'Oswald',sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--paper);
font-family:var(--dp);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#grain{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:.085;mix-blend-mode:overlay;image-rendering:pixelated}
#scan{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.45;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 44%,rgba(2,8,5,.5) 80%,rgba(0,3,1,.94) 100%)}
#red{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(ellipse at center,transparent 34%,rgba(190,20,10,.55) 100%)}
#lb{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .7s}
#lb::before,#lb::after{content:'';position:absolute;left:0;right:0;height:10vh;background:#000}
#lb::before{top:0}#lb::after{bottom:0}#lb.on{opacity:1}
#flash{position:fixed;inset:0;z-index:22;pointer-events:none;background:#fff;opacity:0;transition:opacity .45s}
#fade{position:fixed;inset:0;z-index:23;pointer-events:none;background:#000;opacity:0;transition:opacity .55s}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:10px;z-index:52;display:flex;gap:6px}
.tb{font-family:var(--px);font-size:8px;padding:9px 10px;background:rgba(6,13,10,.85);color:var(--moon);
border:1px solid #2b4a3b;cursor:pointer;letter-spacing:1px;transition:.15s}
.tb:hover{border-color:var(--amber);color:var(--amber)}
.tb.off{color:#4f6a5c;text-decoration:line-through}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;display:none}
#stamp{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;font-family:var(--px);font-size:8px;color:var(--moon);opacity:.9;line-height:1.9}
#stamp i{color:var(--blood);font-style:normal}
#obj{position:absolute;top:44px;left:12px;max-width:min(400px,66vw);font-size:14px;font-weight:600;line-height:1.35;
background:rgba(6,13,10,.74);border-left:3px solid var(--amber);padding:7px 11px}
#obj::before{content:'▸ ';color:var(--amber)}
#inv{position:absolute;top:44px;right:12px;font-family:var(--px);font-size:8px;color:var(--acid);
background:rgba(6,13,10,.74);border:1px solid #234434;padding:7px 10px;display:none}
#batteryHud{position:absolute;top:76px;right:12px;display:flex;align-items:center;gap:7px;padding:6px 8px;
color:var(--moon);background:rgba(6,13,10,.88);border:1px solid #2b4a3b;font:9px var(--px)}
#batteryHud[data-level="low"]{color:var(--amber)}#batteryHud[data-level="empty"]{color:#ff7464}
#batteryHud:not(.on) .cellBody{opacity:.65}
.cellBody{width:24px;height:11px;display:block;position:relative;border:1px solid currentColor;padding:1px}
.cellBody::after{content:'';position:absolute;right:-4px;top:2px;width:2px;height:5px;background:currentColor}
#batteryFill{height:100%;display:block;background:currentColor}
#batteryMsg{position:absolute;top:110px;right:12px;max-width:min(220px,62vw);color:var(--paper);font-size:13px;
text-align:right;background:rgba(6,13,10,.9);border:1px solid #4a3a26;padding:5px 8px}
#goalMarker{position:absolute;top:0;left:0;display:grid;justify-items:center;gap:6px;color:var(--amber);
white-space:nowrap;will-change:transform}
#goalMarker[hidden]{display:none}
#goalGem{display:block;width:14px;height:14px;transform:rotate(45deg);background:rgba(6,13,10,.8);border:2px solid currentColor;
box-shadow:0 0 9px currentColor,inset 0 0 0 2px #060d0a}
#goalDist{font:9px var(--px);line-height:1.35;padding:4px 6px;background:rgba(6,13,10,.92);color:inherit}
#goalMarker.edge #goalGem{background:currentColor}
#goalMarker.chasing{color:#ff5242;animation:goalPulse .55s ease-in-out infinite alternate}

@media(prefers-reduced-motion:reduce){#goalMarker.chasing{animation:none}}
#cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(233,242,234,.8)}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);display:none;font-family:var(--px);font-size:9px;
background:rgba(6,13,10,.88);border:1px solid var(--amber);padding:10px 14px;white-space:nowrap;box-shadow:0 0 16px rgba(255,154,60,.22)}
#prompt b{color:var(--amber)}
#cook{position:absolute;left:50%;bottom:29%;transform:translateX(-50%);width:200px;display:none;text-align:center;font-family:var(--px);font-size:8px;color:var(--amber)}
#cookBar{height:7px;margin-top:6px;background:rgba(6,13,10,.8);border:1px solid #4a3423}
#cookFill{height:100%;width:0;background:linear-gradient(90deg,#b45a28,var(--amber))}
#subs{position:fixed;z-index:40;pointer-events:none;left:50%;bottom:10%;transform:translateX(-50%);width:max-content;max-width:min(660px,90vw);text-align:center;display:none;background:rgba(3,9,6,.8);padding:9px 16px}
#who{display:block;font-family:var(--px);font-size:7px;color:var(--amber);margin-bottom:5px;letter-spacing:1px}
#stxt{font-size:16px;font-style:italic;line-height:1.35}
#subs.sys #stxt{color:var(--dim)}
#chase{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:min(360px,64vw);display:none;text-align:center}
#chase label{font-family:var(--px);font-size:8px;color:var(--blood);letter-spacing:1px;animation:bl 1s steps(2) infinite}
#chaseBar{height:9px;margin-top:6px;background:rgba(6,13,10,.85);border:1px solid #5a1712}

#card{position:fixed;left:0;right:0;top:36%;z-index:12;text-align:center;pointer-events:none;opacity:0}
#card.show{animation:cd 3.2s ease forwards}

.ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px}
.ov.on{display:flex}
#menu{background:linear-gradient(180deg,rgba(4,10,7,.5),rgba(3,8,5,.86) 65%,rgba(1,4,2,.97));text-align:center}
.logo{width:56px;height:56px;margin-bottom:12px;filter:drop-shadow(0 0 12px rgba(255,154,60,.45))}
#menu .pres{font-family:var(--px);font-size:8px;color:var(--dim);letter-spacing:3px;margin-bottom:14px}
#menu h1{font-weight:700;font-size:clamp(38px,8.5vw,88px);letter-spacing:7px;line-height:1;
text-shadow:3px 0 0 rgba(224,62,45,.5),-3px 0 0 rgba(159,216,203,.5),0 0 36px rgba(159,216,203,.2);animation:fk 5s infinite}
@keyframes fk{0%,92%,97%,100%{opacity:1}94%,98%{opacity:.72}}
#menu .tag{font-family:var(--px);font-size:8px;color:var(--moon);margin-top:14px;letter-spacing:2px;line-height:2}
#stampY{display:inline-block;margin-top:14px;font-family:var(--px);font-size:10px;color:var(--blood);border:2px solid var(--blood);

.ovh{font-weight:700;font-size:clamp(26px,5vw,44px);letter-spacing:5px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;width:min(430px,92vw);

.row span{color:var(--dim)}
.seg{display:flex;border:1px solid #2b4a3b}

input[type=range]{width:130px;accent-color:var(--amber)}

#intro{background:transparent;justify-content:flex-end;align-items:center;padding-bottom:12vh}
#phone{position:absolute;top:14vh;left:50%;transform:translateX(-50%);width:min(300px,84vw);background:rgba(4,12,8,.9);

@keyframes wv{0%,100%{height:3px}50%{height:14px}}
#skip{position:absolute;bottom:5vh;right:5vw;font-family:var(--px);font-size:8px;padding:10px 14px;

#os{background:var(--osteal);z-index:34;align-items:stretch;justify-content:flex-start;padding:0;overflow:hidden}
.dicon{position:absolute;font-family:var(--px);font-size:7px;color:#fff;text-align:center;width:80px;cursor:pointer;line-height:1.8;text-shadow:1px 1px 0 #000}

.dicon:hover{background:rgba(255,255,255,.12)}
.win{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:min(720px,95vw);height:min(540px,78vh);
background:var(--os);border:2px solid;border-color:#fff #4a4a4a #4a4a4a #fff;box-shadow:5px 5px 0 rgba(0,0,0,.4);
display:none;flex-direction:column;color:#000}
.win.on{display:flex}
.wt{background:linear-gradient(90deg,#00007c,#1084d0);color:#fff;font-family:var(--px);font-size:8px;padding:6px 7px;
display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
.wt span.x{width:19px;height:16px;background:var(--os);border:1px solid;border-color:#fff #4a4a4a #4a4a4a #fff;color:#000;
display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:monospace;font-weight:700;font-size:11px}
.wc{flex:1;overflow-y:auto;background:#fff;margin:5px;border:2px solid;border-color:#4a4a4a #fff #fff #4a4a4a;padding:10px;
scrollbar-width:thin;scrollbar-color:var(--os) #e2e4e6}
.wc::-webkit-scrollbar{width:14px}
.wc::-webkit-scrollbar-track{background:#e2e4e6;border-left:1px solid var(--osd)}
.wc::-webkit-scrollbar-thumb{background:var(--os);border:2px solid;border-color:#fff #4a4a4a #4a4a4a #fff}
.wc::-webkit-scrollbar-thumb:hover{background:#d8dce0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.th{cursor:pointer;text-align:center;font-family:var(--px);font-size:6px;line-height:1.9;color:#111}
.th img{width:100%;display:block;image-rendering:pixelated;background:#000;border:2px solid;border-color:#4a4a4a #fff #fff #4a4a4a}
.th:hover img{outline:2px solid #00007c}
.th.seen{opacity:.7}.th.seen::after{content:' ✓';color:#0e7f7b}
.th.bad img{animation:gl 4s infinite}
@keyframes gl{0%,93%,100%{transform:none;filter:none}95%{transform:translateX(2px);filter:hue-rotate(50deg)}}
#big{display:none;text-align:center}
#big img{max-width:100%;max-height:46vh;image-rendering:pixelated;border:2px solid;border-color:#4a4a4a #fff #fff #4a4a4a;background:#000}
#big .fn{font-family:var(--px);font-size:7px;margin:9px 0;line-height:1.9}
.ob{font-family:var(--px);font-size:7px;padding:8px 13px;background:var(--os);color:#000;cursor:pointer;
border:2px solid;border-color:#fff #4a4a4a #4a4a4a #fff;letter-spacing:1px}
.ob:active{border-color:#4a4a4a #fff #fff #4a4a4a}
.ob:disabled{color:var(--osd);cursor:not-allowed}
.ws{font-family:var(--px);font-size:6px;padding:6px 8px;border-top:1px solid #fff;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#task{position:absolute;left:0;right:0;bottom:0;height:32px;background:var(--os);border-top:2px solid #fff;display:flex;

#pisWrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#pisCv{background:#04100a;border:2px solid;border-color:#4a4a4a #fff #fff #4a4a4a;image-rendering:pixelated;width:min(304px,80vw);height:auto;touch-action:none}
#pisHud{font-family:var(--px);font-size:7px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;color:#111}
#pisPad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,36px);gap:4px;justify-content:center}
#pisPad button{font-family:var(--px);font-size:9px;background:var(--os);border:2px solid;border-color:#fff #4a4a4a #4a4a4a #fff;cursor:pointer}
#pisPad button:active{border-color:#4a4a4a #fff #fff #4a4a4a;background:#aeb2b6}
#pisMsg{font-family:var(--px);font-size:8px;color:#8a1008;min-height:14px;text-align:center}
#final{background:#000;z-index:35;padding:0}
#finalImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;filter:contrast(1.08) saturate(.85);animation:vj .4s steps(2) infinite}
@keyframes vj{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
#final::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 170px rgba(0,0,0,.9)}
#finalStamp{position:absolute;left:20px;bottom:18px;font-family:var(--px);font-size:10px;color:#cfe8d8;z-index:2;text-shadow:0 0 8px rgba(140,255,158,.7)}

#rollIn .b{font-size:clamp(26px,5.5vw,50px);font-weight:700;letter-spacing:6px;color:var(--amber);text-shadow:0 0 26px rgba(255,154,60,.45),0 2px 10px #000}
#end{background:rgba(2,7,4,.92);z-index:37;text-align:center}

#end .s{font-family:var(--px);font-size:8px;color:var(--dim);margin-top:14px;line-height:2.2}
#map{background:rgba(5,10,7,.86);z-index:43}

  function post(src, i, day, tilt, bad) {
    const c = document.createElement("canvas");

    const g = c.getContext("2d");
    g.fillStyle = "#05080a";
    g.fillRect(0, 0, 320, 240);

    if (tilt) {
      g.translate(160, 120);

    }
    g.drawImage(src, 0, 0, 320, 240);
    g.restore();
    const im = g.getImageData(0, 0, 320, 240),
      d = im.data;
    for (let k = 0; k < d.length; k += 4) {
      const n = (R() - 0.5) * 34;
      d[k] = clamp(d[k] + n, 0, 255);
      d[k + 1] = clamp(d[k + 1] + n, 0, 255);
      d[k + 2] = clamp(d[k + 2] + n, 0, 255);
    }
    g.putImageData(im, 0, 0);
    g.fillStyle = "rgba(0,0,0,0.16)";
    for (let y = 0; y < 240; y += 3) g.fillRect(0, y, 320, 1);
    if (bad) {
      for (let k = 0; k < 5; k++) {
        const y = R() * 220,
          h = 4 + R() * 10;
        const s = g.getImageData(0, y, 320, h);
        g.putImageData(s, (R() - 0.5) * 22, y);
      }
    }
    const vg = g.createRadialGradient(160, 120, 50, 160, 120, 190);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.72)");
    g.fillStyle = vg;
    g.fillRect(0, 0, 320, 240);
    const hh = 1 + Math.floor(i * 0.6 + R() * 0.5),
      mm = Math.floor(R() * 59),
      dd = 14 + day;
    const ts = ("0" + hh).slice(-2) + ":" + ("0" + mm).slice(-2),
      ds = ("0" + dd).slice(-2) + "/06/2007";
    g.font = '10px "Press Start 2P",monospace';
    g.fillStyle = "#cfe8d8";
    g.shadowColor = "#000";
    g.shadowBlur = 4;
    g.fillText("CAM 0" + (i + 1), 10, 222);
    g.fillText(ts + "  " + ds, 10, 236);
    g.fillStyle = "#8cff9e";

    return { url: c.toDataURL(), cam: i, time: ts, date: ds, bad: !!bad || (day === 3 && i === 0) };

  /* Photos are rendered into an offscreen target: no visible-canvas resizing,

  const PHOTO_W = 320,

    c.width = PHOTO_W;

    const g = c.getContext("2d"),

      e.hidden = true;

    }
    const next = G.inside && goal.out ? namedPoint(RV_EXIT, "mapDoor") : goal,
      p = next.p;
    cam.updateMatrixWorld();
    marker3.set(p.x, 1.9, p.z);
    markerLocal.copy(marker3).applyMatrix4(cam.matrixWorldInverse);
    const front = markerLocal.z < -0.12;
    if (front) marker3.project(cam);
    const centerX = W / 2,
      centerY = H / 2,
      limX = Math.max(12, centerX - 34);
    const high = Math.min(H * 0.36, W <= 640 ? 128 : 91);
    const low = Math.max(high + 28, H - (G.touch ? 150 : 43));
    let x = front ? centerX + marker3.x * centerX : centerX,
      y = front ? centerY - marker3.y * centerY : centerY;
    const edge = !front || x < 34 || x > W - 34 || y < high || y > low;
    if (edge) {
      let dx, dy;
      if (front) {
        dx = x - centerX;
        dy = y - centerY;
      } else {
        dx = markerLocal.x;
        dy = Math.abs(dx) < 0.025 ? 1 : 0.24 * Math.abs(dx);
      }
      const vertical = dy < 0 ? Math.max(12, centerY - high) : Math.max(12, low - centerY);
      const scale = 1 / Math.max(Math.abs(dx) / limX, Math.abs(dy) / vertical, 0.00001);
      x = clamp(centerX + dx * scale, 34, Math.max(34, W - 34));
      y = clamp(centerY + dy * scale, high, low);
    }
    e.style.transform =
      "translate3d(" + Math.round(x) + "px," + Math.round(y) + "px,0) translate(-50%,-50%)";

            dzl = box.z + 1.6,
            dzr = 1.6 - box.z,

          else if (m === dxr) box.x = 3.3;
          else if (m === dzl) box.z = -1.6;

        p.p.x = box.x;

      openMap();
      return;
    }
    if (G.ov === "map") {
      if (e.code === "Escape" || (e.code === "KeyE" && !e.repeat)) {
        e.preventDefault();
        closeMap();
      } else if (e.code === "Tab") {
        e.preventDefault();
        $("mapClose").focus();
      }
      return;
    }
    if (e.code === "Space" && G.ov !== "intro" && !canMove()) return;
    if (
      (canMove() || G.ov === "intro" || G.ov === "os") &&
      ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)
    )
      e.preventDefault();
    if (G.ov === "os" && $("winPis").classList.contains("on")) {
      const m = {
        ArrowUp: 0,
        KeyW: 0,
        ArrowRight: 1,
        KeyD: 1,
        ArrowDown: 2,
        KeyS: 2,
        ArrowLeft: 3,
        KeyA: 3,
      };
      if (m[e.code] !== undefined) {
        pis.nd = m[e.code];
        return;
      }
    }
    keys[e.code] = true;
    if (e.repeat && ["KeyE", "KeyF", "Space", "Escape"].includes(e.code)) return;
    if (e.code === "KeyE") doAct();
    if (e.code === "KeyF" && canMove()) setFlash(!G.flash);
    if (e.code === "Space") {
      if (G.ov === "intro") {
        endIntro();
        return;
      }
      G.inp.jump = true;
    }
    if (e.code === "Escape") {
      if (G.ov === "os") {
        $("osExit").click();
        return;
      }
      if (G.ov === "log") {
        closeLog();
        return;
      }
      if (G.ov === "map") {
        closeMap();
        return;
      }
      if (G.ov === "set") {
        closeSet();
        return;
      }
      if (G.ov === "about") {
        hideOv();
        showOv("menu");
        return;
      }
      if (G.phase === "dead" || G.ov === "end" || G.ov === "menu") return;
      togglePause();
    }
  });
  addEventListener("keyup", (e) => {
    keys[e.code] = false;
  });
  addEventListener("blur", clearInput);
  function readKeys() {
    if (!stickActive) {
      G.inp.x = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
      G.inp.y = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    }
    G.inp.run = !!(keys.ShiftLeft || keys.ShiftRight) || touchRun;
  }
  let sens = 1,
    hadLock = false;
  cv.addEventListener("pointerdown", (e) => {
    if (G.touch || !canMove()) return;
    if (window.top === window && cv.requestPointerLock) {
      try {
        cv.requestPointerLock()?.catch(() => {});
      } catch (x) {}
    }
    G.drag = true;
    G.lm = { x: e.clientX, y: e.clientY };
  });
  for (const type of ["pointerup", "pointercancel"])
    addEventListener(type, () => {
      G.drag = false;
      G.lm = null;
    });
  addEventListener("pointermove", (e) => {
    if (G.touch) return;
    const locked = document.pointerLockElement === cv;
    if (!locked && !(G.drag && G.lm)) return;
    const dx = locked ? e.movementX : e.clientX - G.lm.x,
      dy = locked ? e.movementY : e.clientY - G.lm.y;
    if (!locked) G.lm = { x: e.clientX, y: e.clientY };
    if (!canMove()) return;
    G.pl.yaw -= dx * 0.0022 * sens;
    G.pl.pitch = clamp(G.pl.pitch - dy * 0.0022 * sens, -1.35, 1.35);
  });
  document.addEventListener("pointerlockchange", () => {
    const locked = document.pointerLockElement === cv;
    if (hadLock && !locked && canMove()) togglePause();
    hadLock = locked;
  });
  let stickActive = false,
    stickId = null,
    touchRun = false,
    lookId = null,
    lookLast = null;
  const sz = $("sz"),
    sn = $("sn"),
    sb = $("sb");
  sz.addEventListener("pointerdown", (e) => {
    stickActive = true;
    stickId = e.pointerId;
    sz.setPointerCapture(e.pointerId);
    stickMove(e);
  });
  sz.addEventListener("pointermove", (e) => {
    if (stickActive && e.pointerId === stickId) stickMove(e);
  });
  ["pointerup", "pointercancel"].forEach((t) =>
    sz.addEventListener(t, (e) => {
      if (e.pointerId === stickId) {
        stickActive = false;
        G.inp.x = G.inp.y = 0;
        sn.style.transform = "";
      }
    }),
  );
  function stickMove(e) {
    const r = sb.getBoundingClientRect(),
      cx = r.left + r.width / 2,
      cy2 = r.top + r.height / 2;
    let dx = e.clientX - cx,
      dy = e.clientY - cy2;
    const m = Math.hypot(dx, dy),
      lim = r.width / 2;
    if (m > lim) {
      dx *= lim / m;
      dy *= lim / m;
    }
    sn.style.transform = "translate(" + dx + "px," + dy + "px)";
    G.inp.x = dx / lim;
    G.inp.y = -dy / lim;
  }
  const lz = $("lz");
  lz.addEventListener("pointerdown", (e) => {
    lookId = e.pointerId;
    lookLast = { x: e.clientX, y: e.clientY };
    lz.setPointerCapture(e.pointerId);
  });
  lz.addEventListener("pointermove", (e) => {
    if (e.pointerId !== lookId || !lookLast || !canMove()) return;
    G.pl.yaw -= (e.clientX - lookLast.x) * 0.005 * sens;
    G.pl.pitch = clamp(G.pl.pitch - (e.clientY - lookLast.y) * 0.005 * sens, -1.35, 1.35);
    lookLast = { x: e.clientX, y: e.clientY };
  });
  ["pointerup", "pointercancel"].forEach((t) =>
    lz.addEventListener(t, (e) => {
      if (e.pointerId === lookId) {
        lookId = null;
        lookLast = null;
      }
    }),
  );
  $("tE").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    doAct();
  });
  $("tJ").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    G.inp.jump = true;
  });
  $("tF").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (canMove()) setFlash(!G.flash);
  });
  $("tR").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    touchRun = true;
    $("tR").classList.add("hold");
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach((t) =>
    $("tR").addEventListener(t, () => {
      touchRun = false;
      $("tR").classList.remove("hold");
    }),
  );
  function togglePause() {
    if (G.transition || (G.ov && G.ov !== "pause")) return;
    if (G.paused) {
      G.paused = false;
      hideOv();
      $("hud").style.display = "block";
      A.resumeAudio();
      renderSub();
    } else {
      if (
        ![
          "place",
          "collect",
          "laptop",
          "cook",
          "evening",
          "sleep",
          "expedition",
          "chase",
          "ritual",
          "radio",
        ].includes(G.phase)
      )
        return;
      G.paused = true;
      clearInput();
      A.pauseAudio();
      renderSub();
      showOv("pause");
      document.exitPointerLock && document.exitPointerLock();
    }
  }
  $("pauseBtn").onclick = () => {
    if (
      G.ov === "menu" ||
      G.ov === "intro" ||
      G.ov === "end" ||
      G.ov === "final" ||
      G.ov === "roll"
    )
      return;
    togglePause();
  };
  $("bRes").onclick = togglePause;
  $("bRestart").onclick = () => {
    if (G.transition) return;
    fade(1, 300, () => {
      const d = G.day,
        nightOne = G.nightOne;
      resetAll();
      hideOv();
      if (nightOne) startNight1();
      else startDay(d);
      fade(0, 400);
    });
  };
  [$("bMenu1"), $("bMenu2"), $("bMenu3")].forEach(
    (b) =>
      (b.onclick = () => {
        G.paused = false;
        resetAll();
        showOv("menu");
      }),
  );
  $("bNew").onclick = () => startGame(false);
  $("bCont").onclick = () => startGame(true);
  $("bAgain").onclick = () => startGame(false);
  let setBack = "menu";
  function openSet(from) {
    setBack = from;
    showOv("set");
  }
  function closeSet() {
    showOv(setBack);
  }
  $("bSet").onclick = () => openSet("menu");
  $("bSet2").onclick = () => openSet("pause");
  $("setClose").onclick = closeSet;
  $("bAbout").onclick = () => showOv("about");
  $("abClose").onclick = () => showOv("menu");
  $("skip").onclick = endIntro;
  $("langBtn").onclick = () => {
    G.lang = G.lang === "ru" ? "en" : "ru";
    savePrefs();
    applyLang();
  };
  document.querySelectorAll("#segLang button").forEach(
    (b) =>
      (b.onclick = () => {
        G.lang = b.dataset.l;
        savePrefs();
        applyLang();
      }),
  );
  function changeSound(v) {
    G.sound = v;
    if (v) {
      A.unlock();
      A.windOn();
    }
    A.mute(v);
    savePrefs();
    applyLang();
  }
  $("sndBtn").onclick = () => changeSound(!G.sound);
  document
    .querySelectorAll("#segSnd button")
    .forEach((b) => (b.onclick = () => changeSound(b.dataset.v === "1")));
  document.querySelectorAll("#segSub button").forEach(
    (b) =>
      (b.onclick = () => {
        G.subs = b.dataset.v === "1";
        savePrefs();
        applyLang();
      }),
  );
  document.querySelectorAll("#segDual button").forEach(
    (b) =>
      (b.onclick = () => {
        G.dual = b.dataset.v === "1";
        savePrefs();
        applyLang();
        renderSub();
      }),
  );
  document.querySelectorAll("#segQual button").forEach(
    (b) =>
      (b.onclick = () => {
        G.qual = b.dataset.v;
        savePrefs();
        resize();
        applyLang();
      }),
  );
  document.querySelectorAll("#segDiff button").forEach(
    (b) =>
      (b.onclick = () => {
        G.diff = b.dataset.v;
        savePrefs();
        applyLang();
      }),
  );
  $("sens").oninput = (e) => {
    G.sens = clamp(e.target.value / 100, 0.2, 2);
    sens = G.sens;
    savePrefs();
  };
  $("logBtn").onclick = openLog;
  $("logClose").onclick = closeLog;
  $("failReload").onclick = () => location.reload();

  /* ---------- reset ---------- */
  function resetAll() {
    clearT();
    A.stopAll();
    A.windOn();
    clearToast();
    if (window.speechSynthesis) speechSynthesis.cancel();
    G.phase = "menu";
    G.ov = "menu";
    G.day = 1;
    G.time = 0;
    G.clk = 0;
    G.carried = 6;
    G.collected = 0;
    G.viewed = new Set();
    G.photos = {};
    G.flash = false;
    G.charge = 1;
    G.spares = BAT_SPARES;
    G.batMsg = "";
    G.batUntil = 0;
    G.goalCamera = null;
    G.inside = false;
    G.lit = false;
    G.cooking = false;
    G.cookT = 0;
    G.ate = false;
    G.hidden = false;
    G.rstep = 0;
    G.subQueue = [];
    G.cur = null;
    G.log = [];
    G.paused = false;
    G.transition = false;
    G.nightOne = false;
    G.rustle = 6;
    G.stepT = 0;
    G.ev1 = G.ev2 = G.ev3 = G.ev4 = G.ev5 = false;
    G.flags = {};
    G.radio = { t: 0, step: 0 };
    G.rollH = 0;
    mounts = 0;
    introI = 0;
    introT = 0;
    clearInput();
    syncControls();
    G.pl.p.set(2.5, 0, 4.5);
    G.pl.yaw = PI;
    G.pl.pitch = 0;
    G.pl.vy = 0;
    G.pl.gnd = true;
    G.pl.stun = 0;
    G.chase = { d: 16, growl: 3, off: 0, sayT: 0 };
    G.esc = { t: 0, fl: false, spd: 0, step: 0 };
    G.cred = 0;
    A.radioOff();
    $("radioFx").classList.remove("on");
    $("bigCap").textContent = "";
    setFlash(false);
    setEnv("night", true);
    updateWallMap();
    updateSpareMeshes();
    CAMS.forEach((c) => {
      c.mounted = false;
      c.card = false;
      c.trap.visible = false;
      c.glint.visible = true;
      c.led.material = M(0xff3020, 1);
    });
    firePts.visible = false;
    fireGlow.material.opacity = 0;
    fireLight.intensity = 0;
    sausage.visible = stick.visible = false;
    eyesG.visible = false;
    silh.visible = false;
    corpse.visible = false;
    penta.visible = false;
    pentaLight.intensity = 0;
    candles.forEach((c) => (c.visible = false));
    cultists.forEach((c) => {
      c.visible = false;
      c.userData.eyes.forEach((e) => (e.visible = false));
    });
    monster.visible = false;
    carried.visible = false;
    mLight.intensity = 0;
    photoCreature.visible = false;
    photoCorpse.visible = false;
    animals.forEach((a) => (a.visible = false));
    OBS.forEach((o) => {
      o.hit = false;
      o.mesh.visible = false;
    });
    stakeG.visible = false;
    rv.position.set(0, 0, 0);
    rv.rotation.set(0, 0, 0);
    rv.userData.hl.forEach((h) => (h.intensity = 0));
    pis.run = false;
    pisReset(true);
    $("hud").style.display = "none";
    $("chase").style.display = "none";
    $("prompt").style.display = "none";
    $("subs").style.display = "none";
    $("cook").style.display = "none";
    $("red").style.opacity = 0;
    $("lb").classList.remove("on");
    $("winPhoto").classList.remove("on");
    $("winPis").classList.remove("on");
    $("fade").style.opacity = 0;
    $("flash").style.opacity = 0;
    $("radioFx").classList.remove("on");
    $("bigCap").textContent = "";
    inv("");
    setObj("");
    $("bCont").disabled = !getSave();
  }

  /* ---------- grain / resize ---------- */
  const gc = $("grain").getContext("2d"),
    gimg = gc.createImageData(140, 80);
  let gframe = 0;
  function grain() {
    const d = gimg.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = R() * 255;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    gc.putImageData(gimg, 0, 0);
  }
  function resize() {
    W = innerWidth;
    H = innerHeight;
    const pr = Math.min(devicePixelRatio || 1, G.qual === "high" ? 1.35 : 0.8);
    rd.setPixelRatio(pr);
    rd.setSize(W, H, false);
    cam.aspect = W / H;
    cam.updateProjectionMatrix();
    $("grain").style.opacity = G.qual === "high" ? 0.085 : 0.05;
  }
  addEventListener("resize", resize);
  addEventListener("orientationchange", () => uiT(resize, 200));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && canMove() && !G.paused) togglePause();
  });
  addEventListener("contextmenu", (e) => e.preventDefault());
  resize();
  grain();

  /* ---------- loop ---------- */
  let last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05);
    if (!G.paused && G.ov !== "map" && G.ov !== "log") {
      G.time += dt;
      G.clk += dt;
      const p = G.phase;
      if (p === "intro") introTick(dt);
      else if (p === "evening") eveningTick(dt);
      else if (p === "expedition") expeditionTick(dt);
      else if (p === "ritual") ritualTick(dt);
      else if (p === "radio") radioTick(dt);
      else if (p === "chase") chaseTick(dt);
      else if (p === "escape") escapeTick(dt);
      else if (p === "credits") credTick(dt);
      if (p === "cook" && G.cooking) {
        G.cookT += dt;
        $("cook").style.display = "block";
        $("cookFill").style.width = clamp((G.cookT / 4) * 100, 0, 100) + "%";
        sausage.rotation.y += dt * 2;
        if (G.cookT >= 4) {
          G.cooking = false;
          G.ate = true;
          A.sizzleOff();
          sausage.visible = stick.visible = false;
          $("cook").style.display = "none";
          say("q78");
          uiT(() => say("q79"), 2300);
          uiT(() => say("q80"), 4300);
          G.phase = "evening";
          G.clk = -1.4;
          G.ev1 = G.ev2 = G.ev3 = G.ev4 = G.ev5 = false;
          setObj("objCook");
        }
      }
      if (canMove()) {
        readKeys();
        movePlayer(dt);
        scanAct();
      } else if (G.phase === "ritual" && G.hidden) {
        cam.position.set(G.pl.p.x, 1.68, G.pl.p.z);
        cam.rotation.set(G.pl.pitch, G.pl.yaw, 0);
        $("prompt").style.display = "none";
      } else {
        $("prompt").style.display = "none";
      }
      if (p === "menu" || p === "intro") {
        if (p === "menu") {
          const a = G.time * 0.06;
          cam.position.set(Math.cos(a) * 15, 3.4, Math.sin(a) * 15);
          cam.lookAt(0, 1.8, 0);
          cam.fov = 72;
          cam.updateProjectionMatrix();
        }
      }
      subTick();
      A.amb(dt);
      envTick(dt);
      if (!G.ov && G.phase !== "escape" && G.phase !== "credits") batteryTick(dt);
      if (G.lit) {
        fireLight.intensity = 1.5 + Math.sin(G.time * 13) * 0.35 + R() * 0.25;
        const pa = firePts.geometry.attributes.position;
        for (let i = 0; i < pa.count; i++) {
          let y = pa.getY(i) + dt * (1.1 + R());
          if (y > 1.5) {
            y = 0;
            pa.setX(i, (R() - 0.5) * 0.5);
            pa.setZ(i, (R() - 0.5) * 0.5);
          }
          pa.setY(i, y);
        }
        pa.needsUpdate = true;
        if (R() < 0.06) A.nz(0.05, 1200, 1, 0.05, "bandpass");
      }
      const fp = flies.geometry.attributes.position,
        ph = flies.userData.ph;
      for (let i = 0; i < fp.count; i++) {
        let fx = fp.getX(i) + Math.sin(G.time * 0.6 + ph[i]) * dt * 0.35,
          fz = fp.getZ(i) + Math.cos(G.time * 0.5 + ph[i]) * dt * 0.25;
        let fy = fp.getY(i) + Math.cos(G.time * 0.9 + ph[i]) * dt * 0.2;
        if (fx > 27) fx -= 54;
        else if (fx < -27) fx += 54;
        if (fz > 27) fz -= 54;
        else if (fz < -27) fz += 54;
        if (fy > 2.9) fy = 0.5;
        else if (fy < 0.4) fy = 2.6;
        fp.setX(i, fx);
        fp.setY(i, fy);
        fp.setZ(i, fz);
      }
      fp.needsUpdate = true;
      flies.material.opacity = G.env === "morning" ? 0.12 : 0.75;
      stars.material.opacity = G.env === "morning" ? 0 : 0.85;
      moon.material.opacity = G.env === "morning" ? 0 : 0.5;
      CAMS.forEach((c, i) => {
        if (c.trap.visible) c.led.visible = Math.sin(G.time * 3 + i) > 0;
        if (c.glint.visible) c.glint.material.opacity = 0.5 + Math.sin(G.time * 2.4 + i) * 0.35;
      });
      if (eyesG.visible) {
        const b = Math.sin(G.time * 1.7);
        eyesG.scale.y = b > 0.94 ? 0.08 : 1;
      }
      candles.forEach((c, i) => {
        if (c.visible && c.isSprite) c.material.opacity = 0.6 + Math.sin(G.time * 9 + i) * 0.3;
      });
      if (penta.visible)
        pentaLight.intensity = (G.phase === "ritual" ? 1.6 : 0.9) + Math.sin(G.time * 4) * 0.25;
      if (G.ov === "os" && $("winPis").classList.contains("on")) {
        pisStep(dt);
        pisDraw();
      }
      if (++gframe % 4 === 0) grain();
      if (
        ["place", "collect", "laptop", "cook", "evening", "sleep", "expedition", "chase"].includes(
          p,
        )
      )
        $("stampT").textContent = T("dt")[G.stampK] + " · " + stampClock();
      if (G.ov === "os") $("osClock").textContent = stampClock();
    }
    renderGoalMarker();
    rd.render(sc, cam);
  }
  loadPrefs();
  addEventListener("error", (ev) => {
    if (G.ready) {
      console.error(ev.message || ev.error);
      return;
    }
    const f = $("fail");
    f.style.display = "flex";
    $("failT").textContent = T("errTitle");
    $("failS").textContent = String(ev.message || ev.error || "").slice(0, 200);
  });
  updateWallMap();
  applyLang();
  syncControls();
  $("hud").style.display = "none";
  setEnv("night", true);
  G.ready = true;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
